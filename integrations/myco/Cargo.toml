[package]
name = "totem-myco"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Headless Myco pairing and file-transfer integration for Totem"
publish = false

[profile.release]
strip = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
futures-util = "0.3"
hex = "0.4"
nostr = { version = "0.45.3", default-features = false, features = ["std", "os-rng", "nip44", "nip59"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
