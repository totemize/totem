[target.arm-unknown-linux-musleabihf]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[env]
CC_arm_unknown_linux_musleabihf = { value = ".cargo/zig-musl", relative = true, force = true }
CC_aarch64_unknown_linux_musl = { value = ".cargo/zig-musl", relative = true, force = true }
