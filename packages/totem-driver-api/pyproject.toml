[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "totem-driver-api"
version = "1.0.0"
description = "Public capability contracts for independently packaged Totem drivers"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[tool.setuptools.packages.find]
where = ["src"]
