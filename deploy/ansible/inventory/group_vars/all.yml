---
totem_repo_root: "{{ playbook_dir }}/../../.."
totem_deploy_root: /var/lib/totem-deploy
totem_migration_root: "{{ totem_deploy_root }}/migrations"
totem_artifact_state_root: "{{ totem_deploy_root }}/artifacts"
totem_remote_cache: /var/cache/totem-deploy
totem_service_restarts_enabled: true
totem_device_manager_enabled: true
totem_screen_enabled: false
totem_fips_lan_rendezvous_enabled: true
totem_eink_driver: ""
totem_eink_full_refresh_every: 0
totem_screen_rotation: 0
totem_screen_snapshot_poll_seconds: 15
totem_screen_reconnect_seconds: 2
totem_screen_coalesce_seconds: 2.1
totem_screen_caption_word_seconds: 1.2
totem_screen_low_battery_percent: 20
totem_screen_critical_battery_percent: 8
totem_screen_sequence_rates: ""
totem_screen_scene_dwells: ""
totem_screen_scene_priorities: ""
totem_screen_max_pending_scenes: 8
totem_ups_driver: ""
totem_boot_config_path: /boot/firmware/config.txt
totem_spi_enabled: false
totem_i2c_enabled: false
totem_reboot_on_hardware_config_change: false
totem_force_hardware_reboot: false
totem_local_artifact_root: >-
  {{ playbook_dir }}/../artifacts/{{ totem_artifact_arch }}

totem_base_packages:
  - ca-certificates
  - curl
  - rsync
  - python3

totem_device_manager_packages:
  - python3-venv
  - python3-pip
  - python3-poetry-core
  - python3-numpy
  - python3-pil
  - fonts-dejavu-core
  - python3-fastapi
  - python3-uvicorn
  - python3-pydantic
  - python3-rpi.gpio
  - python3-spidev
  - python3-gpiozero
  - python3-libgpiod
  - python3-smbus

totem_device_groups:
  - fips
  - gpio
  - i2c
  - spi
