---
- name: Reload systemd for device manager
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload udev rules
  ansible.builtin.command:
    argv: [udevadm, control, --reload-rules]
  changed_when: true

- name: Reload rfkill device permissions
  ansible.builtin.command:
    argv:
      - udevadm
      - trigger
      - --action=change
      - --subsystem-match=misc
      - --sysname-match=rfkill
  changed_when: true

- name: Restart device manager
  ansible.builtin.systemd_service:
    name: totem.service
    state: restarted
  when: totem_service_restarts_enabled | bool

- name: Restart screen state service
  ansible.builtin.systemd_service:
    name: totem-screen.service
    state: restarted
  when:
    - totem_service_restarts_enabled | bool
    - totem_screen_enabled | bool
