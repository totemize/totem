name: Python device layer

on:
  push:
    paths:
      - "totem/python/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "totem/python/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:
    inputs:
      run_hardware:
        description: "Run hardware smoke tests on a Totem self-hosted runner"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  unit:
    name: Linux / Python ${{ matrix.python-version }} / mock transports
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: totem/python/pyproject.toml
      - name: Install device layer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ./totem/python
          python -m pip install "pytest>=7.3,<9" "pytest-cov>=4,<7" "httpx>=0.27,<0.28"
      - name: Run deterministic unit and mock-transport tests
        working-directory: totem/python
        run: pytest -m "unit and not hardware" --cov=devices --cov=managers --cov=service

  hardware:
    name: Totem hardware smoke tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hardware }}
    runs-on: [self-hosted, linux, arm64, totem-hardware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install device layer with hardware extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable "./totem/python[raspberry-pi]"
          python -m pip install "pytest>=8,<9"
      - name: Run opt-in hardware tests
        working-directory: totem/python
        run: pytest tests/hardware -m hardware --run-hardware
