[package]
name = "totemd"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Totem control-plane daemon and net code (spec/10-control-plane.md)"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# totemctl bus client only; sync + small; no TLS — loopback plain HTTP only,
# and dropping rustls/ring keeps the crate pure-Rust for musl cross builds
ureq = { version = "2", default-features = false, features = ["json"] }
