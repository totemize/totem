# Static musl cross builds link with rust-lld (ships with rustup) — the
# host has no arm cross-gcc, and the crate is pure Rust so lld suffices.
#   armv6 (totem, metot): arm-unknown-linux-musleabihf
#   aarch64 (motown):     aarch64-unknown-linux-musl
[target.arm-unknown-linux-musleabihf]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
