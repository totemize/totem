[project]
name = "totem"
version = "0.2.0"
description = "Nostr-native hardware device management for Totem"
authors = [{ name = "Totem contributors" }]
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "pillow>=9.2,<12.0",
    "numpy>=1.23",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
# Wi-Fi drivers also require the nmcli executable.
raspberry-pi = [
    "RPi.GPIO>=0.7,<1.0; sys_platform == 'linux'",
    "spidev>=3.6,<4.0; sys_platform == 'linux'",
    "gpiozero>=2.0,<3.0; sys_platform == 'linux'",
    "gpiod>=1.5,<3.0; sys_platform == 'linux'",
    "smbus2>=0.4,<1.0; sys_platform == 'linux'",
]

[project.scripts]
totem = "totem.__main__:main"
totem-api = "totem.api.app:start_server"

[tool.poetry]
packages = [{ include = "totem", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.3,<9.0"
pytest-cov = ">=4.1,<7.0"
httpx = ">=0.27,<0.28"
black = ">=23.3,<26.0"
flake8 = ">=6.0,<8.0"
mypy = ">=1.3,<2.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/hardware"]
addopts = "-ra --strict-markers"
markers = [
    "unit: deterministic tests that require no Totem hardware",
    "mock_transport: tests that exercise explicit in-memory or filesystem transports",
    "hardware: opt-in tests that require a connected Totem hardware component",
]

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
